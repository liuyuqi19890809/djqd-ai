<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="党建问答AI">
    <title>党建问答AI - 智能党务助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #c41e3a, #8b0000);
            color: #fff;
            padding: 16px 20px;
            text-align: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .header .subtitle {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message.bot {
            align-self: flex-start;
            background: #fff;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #c41e3a, #a01830);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.loading {
            align-self: flex-start;
            background: #fff;
            color: #999;
            font-style: italic;
        }
        .message h3 {
            font-size: 15px;
            margin-bottom: 6px;
            color: #c41e3a;
        }
        .message p {
            margin-bottom: 8px;
        }
        .welcome {
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            color: #fff;
            text-align: center;
            padding: 20px;
            border-radius: 16px;
        }
        .welcome .emblem {
            font-size: 40px;
            margin-bottom: 8px;
        }
        .welcome h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .welcome p {
            font-size: 13px;
            opacity: 0.9;
        }
        .quick-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
        }
        .quick-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }
        .quick-btn:active {
            background: rgba(255,255,255,0.35);
        }
        .input-area {
            flex-shrink: 0;
            background: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-area textarea {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            max-height: 100px;
            line-height: 1.4;
        }
        .input-area textarea:focus {
            border-color: #c41e3a;
        }
        .input-area button {
            background: linear-gradient(135deg, #c41e3a, #a01830);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .disclaimer {
            text-align: center;
            font-size: 11px;
            color: #999;
            padding: 4px;
            background: #fff;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>☭ 党建问答AI</h1>
    <div class="subtitle">智能党务助手</div>
</div>

<div class="chat-area" id="chatArea">
    <div class="welcome">
        <div class="emblem">☭</div>
        <h2>党建问答AI</h2>
        <p>您好！我是线上党建指导员，能为基层党务工作者排忧解难的党建顾问，有党建问题都能问我～</p>
        <div class="quick-btns">
            <div class="quick-btn" onclick="sendQuick('三会一课如何开展')">三会一课如何开展</div>
            <div class="quick-btn" onclick="sendQuick('发展党员的流程是什么')">发展党员流程</div>
            <div class="quick-btn" onclick="sendQuick('党费怎么缴纳')">党费缴纳</div>
            <div class="quick-btn" onclick="sendQuick('组织关系怎么转接')">组织关系转接</div>
        </div>
    </div>
</div>

<div class="disclaimer">内容由AI生成，仅供参考，具体以区委组织部最新文件为准</div>

<div class="input-area">
    <textarea id="userInput" rows="1" placeholder="输入您的党务问题..." onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
const BOT_ID = '7636091245848313902';
const API_TOKEN = 'pat_zliJr6IqE4GIQFadZhpgHpSLoK8Ti5pPdrMX2OMuonIhx76bwGpJjPJx6uAZTVy8';
const API_URL = 'https://api.coze.cn/v3/chat';

let conversationId = null;
let isLoading = false;

const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function sendQuick(text) {
    userInput.value = text;
    sendMessage();
}

function addMessage(type, text) {
    const div = document.createElement('div');
    div.className = 'message ' + type;
    div.innerHTML = text;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
}

function removeMessage(el) {
    if (el && el.parentNode) el.parentNode.removeChild(el);
}

async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isLoading) return;

    userInput.value = '';
    isLoading = true;
    sendBtn.disabled = true;

    addMessage('user', escapeHtml(text));
    const loadingEl = addMessage('loading', '正在思考中...');

    try {
        const payload = {
            bot_id: BOT_ID,
            user_id: 'web_user_' + Math.random().toString(36).substr(2, 6),
            stream: false,
            auto_save_history: true,
            additional_messages: [{
                role: 'user',
                content: text,
                content_type: 'text'
            }]
        };

        if (conversationId) {
            payload.conversation_id = conversationId;
        }

        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + API_TOKEN,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.code !== 0) {
            removeMessage(loadingEl);
            addMessage('bot', '❌ 请求出错：' + (data.msg || '未知错误'));
            return;
        }

        conversationId = data.data.conversation_id;
        const chatId = data.data.id;

        // Poll for completion
        let attempts = 0;
        const maxAttempts = 60;
        const pollInterval = setInterval(async () => {
            attempts++;
            if (attempts > maxAttempts) {
                clearInterval(pollInterval);
                removeMessage(loadingEl);
                addMessage('bot', '❌ 响应超时，请重试');
                isLoading = false;
                sendBtn.disabled = false;
                return;
            }

            try {
                const pollResp = await fetch(
                    'https://api.coze.cn/v3/chat/retrieve?chat_id=' + chatId + '&conversation_id=' + conversationId,
                    {
                        headers: { 'Authorization': 'Bearer ' + API_TOKEN }
                    }
                );
                const pollData = await pollResp.json();

                if (pollData.data && pollData.data.status === 'completed') {
                    clearInterval(pollInterval);
                    // Get messages
                    const msgResp = await fetch(
                        'https://api.coze.cn/v3/chat/message/list?chat_id=' + chatId + '&conversation_id=' + conversationId,
                        {
                            headers: { 'Authorization': 'Bearer ' + API_TOKEN }
                        }
                    );
                    const msgData = await msgResp.json();

                    removeMessage(loadingEl);

                    if (msgData.data && msgData.data.length > 0) {
                        const answerMsg = msgData.data.find(m => m.role === 'assistant' && m.type === 'answer');
                        if (answerMsg) {
                            addMessage('bot', formatAnswer(answerMsg.content));
                        } else {
                            addMessage('bot', '抱歉，未能获取到回答，请重新提问。');
                        }
                    } else {
                        addMessage('bot', '抱歉，未能获取到回答，请重新提问。');
                    }
                    isLoading = false;
                    sendBtn.disabled = false;
                }
            } catch (e) {
                console.error('Poll error:', e);
            }
        }, 2000);

    } catch (error) {
        removeMessage(loadingEl);
        addMessage('bot', '❌ 网络错误：' + error.message);
        isLoading = false;
        sendBtn.disabled = false;
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatAnswer(text) {
    // Simple markdown-like formatting
    let html = escapeHtml(text);
    // Bold
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Line breaks
    html = html.replace(/\n/g, '<br>');
    return html;
}

// Auto-resize textarea
userInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
</script>

</body>
</html>
